name: Containers

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: smart_building_test
          POSTGRES_USER: sb_test
          POSTGRES_PASSWORD: test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sb_test -d smart_building_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: backend
    env:
      TEST_DATABASE_URL: postgresql+asyncpg://sb_test:test_password@127.0.0.1:5432/smart_building_test
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_USER: sb_test
      POSTGRES_PASSWORD: test_password
      POSTGRES_DB: smart_building_test
      PAYMENT_GATEWAY_MOCK: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m compileall -q app
      - run: python -m pytest -q

  frontend-check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  image-build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        component: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Build ${{ matrix.component }} image
        run: docker build -t smart-building-${{ matrix.component }}:ci ./${{ matrix.component }}

  publish:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.DOCKERHUB_REPOSITORY != ''
    needs: [backend-test, frontend-check, image-build]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        component: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.component }}
          push: true
          tags: ${{ vars.DOCKERHUB_REPOSITORY }}:${{ matrix.component }}-${{ github.sha }}

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: [publish]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: ec2-production
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: us-east-2
      EC2_INSTANCE_ID: i-0ac056f3c25c1949a
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::473247067977:role/smart-building-github-deploy-role
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: smart-building-${{ github.run_id }}
          role-duration-seconds: 1800
          allowed-account-ids: '473247067977'
      - name: Deploy the published commit through SSM
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          set -euo pipefail
          command_id=$(aws ssm send-command \
            --instance-ids "$EC2_INSTANCE_ID" \
            --document-name SmartBuildingDeploy \
            --parameters "ImageTag=$IMAGE_TAG" \
            --timeout-seconds 60 \
            --comment "Deploy GitHub commit $IMAGE_TAG" \
            --query Command.CommandId --output text)
          echo "SSM command: $command_id"
          for attempt in $(seq 1 180); do
            if result=$(aws ssm get-command-invocation --instance-id "$EC2_INSTANCE_ID" --command-id "$command_id" --output json 2>/tmp/ssm-error); then
              status=$(jq -r '.Status' <<< "$result")
              case "$status" in
                Success)
                  jq -r '.StandardOutputContent' <<< "$result"
                  exit 0 ;;
                Failed|Cancelled|TimedOut|Cancelling)
                  jq -r '.StandardOutputContent, .StandardErrorContent' <<< "$result"
                  exit 1 ;;
              esac
            elif ! grep -q InvocationDoesNotExist /tmp/ssm-error; then
              cat /tmp/ssm-error
              exit 1
            fi
            sleep 5
          done
          echo 'SSM monitoring timed out; check the command before retrying.'
          exit 1
